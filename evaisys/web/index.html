<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EvaISYS — Araç İzleme Paneli</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login" class="login-overlay">
    <form id="login-form" class="login-box">
      <h2>⚡ EvaISYS</h2>
      <p class="muted">Araç İzleme Paneli — giriş</p>
      <input id="username" placeholder="kullanıcı adı" value="admin" autocomplete="username" />
      <input id="password" type="password" placeholder="parola" value="admin123" autocomplete="current-password" />
      <button type="submit" class="primary">Giriş</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>

  <header>
    <h1>⚡ EvaISYS <span>Araç İzleme</span></h1>
    <div class="header-right">
      <div id="status" class="status">bağlanıyor…</div>
      <button id="logout" class="logout">Çıkış</button>
    </div>
  </header>

  <main>
    <section id="fleet" class="fleet">
      <h2>Araçlar (<span id="count">0</span>)</h2>
      <div id="cards"></div>
    </section>
    <section class="map-wrap">
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
