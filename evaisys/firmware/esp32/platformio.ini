; EvaISYS ESP32 VCU düğümü — PlatformIO yapılandırması
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.0.3

; --- Ayarlar: kendi ortamınıza göre değiştirin ---
build_flags =
    -D WIFI_SSID='"YOUR_WIFI"'
    -D WIFI_PASS='"YOUR_PASS"'
    -D BACKEND_URL='"http://192.168.1.100:3000"'
    -D VEHICLE_ID='"EVA-001"'
